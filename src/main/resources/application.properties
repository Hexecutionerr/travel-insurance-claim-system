# Spring Boot application properties for local development

# Application name
spring.application.name=travel-insurance-claim-system

# Server port
server.port=8081

# H2 In-Memory Database configuration
spring.datasource.url=jdbc:h2:mem:claimdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate settings
# create-drop: creates schema on startup, drops on shutdown (suitable for dev/demo)
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Enable H2 web console (useful for database inspection during development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
